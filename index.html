<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Doctor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F6;--ink:#16212B;--mute:#68757F;--line:#D8DFE2;--pass:#238574;--fail:#C4492F;--warn:#B07A1C;--idle:#C3CCD2;--panel:#EBEFF0;--mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace;--mx:50vw;--my:30vh;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0E1418;--ink:#E7EDF0;--mute:#8693A0;--line:#222E36;--pass:#4DBBA5;--fail:#E27A62;--warn:#D9A441;--idle:#36434C;--panel:#141C21}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:400 16px/1.55 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0}
body::before{background:radial-gradient(var(--line) 1px,transparent 1.5px) 0 0/28px 28px;opacity:.7;-webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%)}
body::after{background:radial-gradient(color-mix(in srgb,var(--pass) 70%,var(--ink)) 1px,transparent 1.6px) 0 0/28px 28px;-webkit-mask-image:radial-gradient(circle 240px at var(--mx) var(--my),#000,transparent);mask-image:radial-gradient(circle 240px at var(--mx) var(--my),#000,transparent);opacity:.55}
main{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:32px 28px 72px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font-weight:500}
.ecg path{fill:none;stroke:var(--pass);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
body.running .ecg path{stroke-dasharray:34;animation:ecg 1.1s linear infinite}
@keyframes ecg{from{stroke-dashoffset:34}to{stroke-dashoffset:-34}}
.chip{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 11px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--idle);transition:background .3s}
.chip[data-state=running] i{background:var(--warn);animation:pulse 1s ease-in-out infinite}
.chip[data-state=pass] i{background:var(--pass)}
.chip[data-state=fail] i,.chip[data-state=error] i{background:var(--fail)}

.layout{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(40px,7vw,96px);align-items:start;margin-top:clamp(36px,9vh,88px)}
.hero{position:sticky;top:48px}
h1{font:400 clamp(44px,6.4vw,84px)/1 'Instrument Serif',Georgia,serif;letter-spacing:-.02em;margin:0 0 20px;min-height:2em}
#lede p{margin:0 0 10px;max-width:42ch;color:var(--mute)}
form{display:flex;gap:10px;margin-top:28px}
input{flex:1;min-width:0;font:inherit;color:inherit;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .2s}
input:hover{border-color:var(--mute)}
input:focus{outline:none;border-color:var(--pass);box-shadow:0 0 0 3px color-mix(in srgb,var(--pass) 18%,transparent)}
button{font:inherit;cursor:pointer}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 22px;font-weight:500;transition:transform .2s,opacity .2s}
.go:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--pass);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.meta{margin:22px 0 0;font-size:14px;color:var(--mute)}

.path{position:relative;list-style:none;margin:0;padding:0}
.node{position:relative;padding-left:36px;animation:fade .7s both;animation-delay:calc(var(--i)*90ms + 350ms)}
.node:not(:last-child)::after{content:"";position:absolute;left:5px;top:33px;bottom:-22px;width:1px;background:var(--line);transition:background .6s}
.node[data-state=pass]:not(:last-child)::after,.node[data-state=warn]:not(:last-child)::after{background:var(--pass)}
.dot{position:absolute;left:0;top:22px;width:11px;height:11px;border-radius:50%;background:var(--idle);z-index:1;transition:background .4s,box-shadow .4s}
.dot::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid currentColor;opacity:0}
.node.pop .dot::after{animation:ripple .9s ease-out}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(3.6);opacity:0}}
.node[data-state=pass]{color:var(--pass)}.node[data-state=fail]{color:var(--fail)}.node[data-state=warn]{color:var(--warn)}.node[data-state=running]{color:var(--ink)}
.node[data-state=pass] .dot{background:var(--pass)}
.node[data-state=fail] .dot{background:var(--fail);box-shadow:0 0 0 4px color-mix(in srgb,var(--fail) 18%,transparent)}
.node[data-state=warn] .dot{background:var(--warn)}
.node[data-state=skip] .dot{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--idle)}
.node[data-state=running] .dot{background:var(--ink);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.packet{position:absolute;left:0;top:22px;width:11px;height:11px;border-radius:50%;background:var(--ink);z-index:2;opacity:0;pointer-events:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--pass) 25%,transparent),0 0 20px 5px color-mix(in srgb,var(--pass) 55%,transparent);transition:top .8s cubic-bezier(.65,0,.35,1),opacity .4s}
.packet.on{opacity:1}

.row{display:grid;grid-template-columns:1fr auto 12px;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:14px 0;opacity:.5;transition:opacity .4s}
.node:not([data-state=idle]) .row{opacity:1}
.row:disabled{cursor:default}
.name{display:block;font-weight:500}
.sub{display:block;font-size:14px;color:var(--mute)}
.ms{font:400 13px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.node[data-state=running] .ms{color:var(--ink)}
.bar{display:block;height:2px;margin-top:9px;background:var(--line);border-radius:2px;overflow:hidden;opacity:0;transition:opacity .4s}
.bar i{display:block;height:100%;background:var(--pass);transform-origin:left;transform:scaleX(0);transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.node[data-state=pass] .bar{opacity:1}
.chev{color:var(--mute);transition:transform .2s;visibility:hidden}
.node[data-state=pass] .chev,.node[data-state=fail] .chev,.node[data-state=warn] .chev,.node[data-state=skip] .chev{visibility:visible}
.row[aria-expanded=true] .chev{transform:rotate(180deg)}
.detail{padding:0 0 18px;font-size:14px;animation:fade .35s both}
.detail[hidden]{display:none}
.why{margin:0 0 12px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 20px;margin:0}
dt{color:var(--mute)}
dd{margin:0;word-break:break-word;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font:13px var(--mono)}
th,td{text-align:left;padding:5px 16px 5px 0;white-space:nowrap}
th{font-weight:400;color:var(--mute)}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:4px}
.checks li{display:flex;gap:8px;align-items:center}
.checks i{width:7px;height:7px;border-radius:50%;background:var(--pass);flex:none}
.checks .bad i{background:var(--fail)}

.log{margin-top:28px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 75%,transparent);font:12.5px/1.9 var(--mono);color:var(--mute)}
.log p{display:grid;grid-template-columns:52px 46px 1fr;margin:0;animation:fade .35s both}
.log b{font-weight:500;color:var(--ink)}
.log .ok b{color:var(--pass)}.log .bad b{color:var(--fail)}.log .warn b{color:var(--warn)}
.log span{color:var(--ink);opacity:.85;min-width:0;word-break:break-word}
.foot{margin:64px 0 0;font-size:13px;color:var(--mute)}
.fade{animation:fade .6s both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

#cd,#cr{position:fixed;left:0;top:0;pointer-events:none;z-index:99;opacity:0;mix-blend-mode:difference;transition:opacity .25s}
#cd::before,#cr::before{content:"";display:block;border-radius:50%}
#cd::before{width:6px;height:6px;margin:-3px 0 0 -3px;background:#fff}
#cr::before{width:34px;height:34px;margin:-17px 0 0 -17px;border:1px solid #fff;transition:transform .25s cubic-bezier(.3,1.4,.5,1),background .25s,border-radius .25s}
body.cur-on #cd,body.cur-on #cr{opacity:1}
body[data-cur=link] #cr::before{transform:scale(1.7);background:rgba(255,255,255,.2)}
body[data-cur=text] #cd,body[data-cur=text] #cr{opacity:0}
body.down #cr::before{transform:scale(.7)}
.has-cursor,.has-cursor *{cursor:none!important}
.has-cursor input{cursor:text!important}

@media(max-width:860px){.layout{grid-template-columns:1fr}.hero{position:static}h1{min-height:0}}
@media(max-width:480px){form{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="cd"></div><div id="cr"></div>
<main>
  <header class="top">
    <span class="brand">
      <svg class="ecg" viewBox="0 0 26 16" width="26" height="16" aria-hidden="true"><path d="M1 8h6l2-6 4 12 3-9 2 3h7"/></svg>
      Network Doctor
    </span>
    <span class="chip" id="chip" data-state="idle"><i></i><span>Ready</span></span>
  </header>

  <div class="layout">
    <section class="hero">
      <h1 id="headline">Check your connection</h1>
      <div id="lede"><p>Tests your router, the internet, DNS and a secure connection in order, then explains what it found.</p></div>
      <form id="form">
        <input id="domain" value="google.com" aria-label="Website to test" spellcheck="false" autocomplete="off" maxlength="253">
        <button class="go" id="go" type="submit">Run check</button>
      </form>
      <p class="meta" id="meta" hidden></p>
    </section>

    <section>
      <ol class="path" id="path"></ol>
      <div class="log" id="log" aria-hidden="true" hidden></div>
    </section>
  </div>

  <p class="foot">Runs on this computer. Every result comes straight from network-doctor.py.</p>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const STEPS = [
  {key:'gateway',  tag:'ICMP', name:'Your router',      idle:'Default gateway',   run:()=>'Sending an ICMP echo to your gateway',       sub:r=>r.destination?`Gateway ${r.destination}`:'Default gateway'},
  {key:'internet', tag:'ICMP', name:'The internet',     idle:'Ping 1.1.1.1',      run:()=>'Pinging 1.1.1.1',                           sub:r=>`Ping ${r.destination||'1.1.1.1'}`},
  {key:'dns',      tag:'DNS',  name:'Name lookup',      idle:'DNS',               run:d=>`Asking 8.8.8.8 for ${d}`,                    sub:r=>r.domain?`${r.domain} via ${r.server}`:'DNS'},
  {key:'tcp',      tag:'TCP',  name:'Connection',       idle:'Port 443',          run:()=>'Opening a connection on port 443',          sub:r=>r.server?`${r.server}, port ${r.port}`:'Port 443'},
  {key:'tls',      tag:'TLS',  name:'Secure handshake', idle:'Certificate check', run:()=>'Negotiating TLS, checking the certificate', sub:r=>r.tls_version?`${r.tls_version}, certificate verified`:'Certificate check'}
];
const STEP_MS = [1800, 1600, 2000, 1600, 2200];
const LABELS = {tls_version:'TLS version', rcode_name:'Response code', record_type:'Record type', certificate_verified:'Certificate verified'};
const HIDE = new Set(['success','reason','latency_ms','connection_plus_tls_ms','checks','answers','response_valid','rcode']);

const SAMPLE = {domain:'google.com', ran_at:new Date().toISOString(), duration_s:2.4, results:{
  gateway:{success:true,reason:'Ping reply validated',destination:'192.168.1.1',latency_ms:3.1,checks:{ip_addresses:true,echo_reply_type:true,icmp_code:true,identifier:true,sequence:true}},
  internet:{success:true,reason:'Ping reply validated',destination:'1.1.1.1',latency_ms:24.8,checks:{ip_addresses:true,echo_reply_type:true,icmp_code:true,identifier:true,sequence:true}},
  dns:{success:true,reason:'DNS resolution successful',response_valid:true,server:'8.8.8.8',domain:'google.com',record_type:'A',rcode:0,rcode_name:'NOERROR',latency_ms:31.4,checks:{source_ip:true,destination_ip:true,source_port:true,destination_port:true,is_response:true,transaction_id:true,opcode:true,question:true},answers:[{name:'google.com',type:'A',ttl:112,data:'142.250.185.78'}]},
  tcp:{success:true,reason:'TCP connection established',server:'142.250.185.78',port:443,latency_ms:29.7},
  tls:{success:true,reason:'TLS handshake successful; certificate verification passed',server:'142.250.185.78',domain:'google.com',tls_version:'TLSv1.3',cipher:'TLS_AES_256_GCM_SHA384',certificate_verified:true,connection_plus_tls_ms:88.2},
  diagnosis:['DNS, TCP, and TLS checks succeeded. The tested HTTPS connection path is working. This does not yet test an HTTP response.']
}};

/* ---------- build the path ---------- */
const path = $('#path');
path.innerHTML = '<span class="packet" id="packet"></span>' + STEPS.map((s,i) => `
  <li class="node" data-state="idle" style="--i:${i}">
    <span class="dot"></span>
    <button class="row" type="button" aria-expanded="false" disabled>
      <span class="txt"><span class="name">${s.name}</span><span class="sub">${s.idle}</span><span class="bar"><i></i></span></span>
      <span class="ms"></span>
      <svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="detail" hidden></div>
  </li>`).join('');
const nodes = [...path.querySelectorAll('.node')];
const packet = $('#packet');
let lastReport = null, running = false, runT = 0, active = null, t0 = 0, maxMs = 1, target = null, dur = 1000;

path.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row || row.disabled) return;
  const open = row.getAttribute('aria-expanded') === 'true';
  row.setAttribute('aria-expanded', String(!open));
  row.nextElementSibling.hidden = open;
});

/* ---------- text decode effect ---------- */
function decode(el, text, ms = 750) {
  cancelAnimationFrame(el._r);
  if (reduce) { el.textContent = text; return; }
  const glyphs = '01/\\|:+#', start = performance.now();
  const step = now => {
    const p = Math.min(1, (now - start) / ms);
    el.textContent = [...text].map((c, i) => c === ' ' || i < p * text.length * 1.2 ? c : glyphs[Math.random() * glyphs.length | 0]).join('');
    if (p < 1) el._r = requestAnimationFrame(step); else el.textContent = text;
  };
  el._r = requestAnimationFrame(step);
}

/* ---------- helpers ---------- */
const msOf = r => r.latency_ms != null ? r.latency_ms : r.connection_plus_tls_ms;
function stateOf(key, r, all) {
  if (r.success) return 'pass';
  if (/^Skipped/.test(r.reason)) return 'skip';
  if ((key === 'gateway' || key === 'internet') && all.tls && all.tls.success) return 'warn';
  return 'fail';
}
function verdict(a) {
  if (a.tls && a.tls.success) return 'Your connection is healthy';
  if (!a.gateway.success && !a.internet.success && !a.dns.success) return 'You appear to be offline';
  if (!a.dns.success) return 'Names are not resolving';
  if (!a.tcp.success) return 'The server cannot be reached';
  return 'The secure handshake failed';
}
function detail(r) {
  let h = `<p class="why">${esc(r.reason)}</p><dl>`;
  for (const [k, v] of Object.entries(r)) {
    if (HIDE.has(k) || v == null) continue;
    const label = LABELS[k] || k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, ' ');
    h += `<dt>${esc(label)}</dt><dd>${esc(typeof v === 'boolean' ? (v ? 'Yes' : 'No') : v)}</dd>`;
  }
  h += '</dl>';
  if (r.answers && r.answers.length) h += `<div class="scroll"><table><tr><th>Name</th><th>Type</th><th>TTL</th><th>Address</th></tr>` +
    r.answers.map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${esc(a.ttl)}s</td><td>${esc(a.data)}</td></tr>`).join('') + `</table></div>`;
  if (r.checks) h += `<ul class="checks">` + Object.entries(r.checks).map(([k, ok]) =>
    `<li class="${ok ? '' : 'bad'}"><i></i>${esc(k.replace(/_/g, ' '))}: ${ok ? 'passed' : 'failed'}</li>`).join('') + `</ul>`;
  return h;
}
function log(tag, text, cls = '') {
  const l = $('#log');
  l.hidden = false;
  const t = ((performance.now() - runT) / 1000).toFixed(2);
  l.insertAdjacentHTML('beforeend', `<p class="${cls}"><time>+${t}s</time><b>${tag}</b><span>${esc(text)}</span></p>`);
}
function setChip(state, text) { const c = $('#chip'); c.dataset.state = state; c.lastElementChild.textContent = text; }
function movePacket(i) { packet.style.top = (nodes[i].offsetTop + 22) + 'px'; }

/* ---------- timer: eases toward the real latency, never above it ---------- */
(function tick() {
  if (active && target != null) {
    const p = Math.min(1, (performance.now() - t0) / dur);
    active.querySelector('.ms').textContent = (target * (1 - Math.pow(1 - p, 3))).toFixed(2) + ' ms';
  }
  requestAnimationFrame(tick);
})();

/* ---------- run sequence ---------- */
function setRunning(domain) {
  nodes.forEach((n, i) => {
    n.dataset.state = 'idle';
    const row = n.querySelector('.row');
    row.disabled = true;
    row.setAttribute('aria-expanded', 'false');
    row.querySelector('.sub').textContent = STEPS[i].idle;
    row.querySelector('.ms').textContent = '';
    row.querySelector('.bar i').style.transform = 'scaleX(0)';
    n.querySelector('.detail').hidden = true;
  });
  packet.style.transition = 'none';
  movePacket(0);
  void packet.offsetWidth;
  packet.style.transition = '';
  packet.classList.add('on');
  $('#log').innerHTML = '';
  $('#meta').hidden = true;
  decode($('#headline'), 'Scanning…', 500);
  $('#lede').innerHTML = `<p>Running five checks against ${esc(domain)}, one after another.</p>`;
  $('#go').disabled = true;
  $('#go').textContent = 'Running…';
  document.body.classList.add('running');
  setChip('running', 'Scanning');
}

function activate(i, domain) {
  const n = nodes[i];
  n.dataset.state = 'running';
  n.querySelector('.sub').textContent = STEPS[i].run(domain);
  active = n; target = null;
  n.querySelector('.ms').textContent = '';
  movePacket(i);
  log(STEPS[i].tag, STEPS[i].run(domain));
}

function settle(i, all) {
  const step = STEPS[i], r = all[step.key], n = nodes[i], row = n.querySelector('.row');
  const state = stateOf(step.key, r, all), ms = msOf(r);
  active = null;
  n.dataset.state = state;
  row.querySelector('.sub').textContent = state === 'pass' ? step.sub(r) :
    state === 'warn' ? 'No reply, but later checks passed. Ping may be blocked.' : r.reason;
  row.querySelector('.ms').textContent = ms != null ? `${Number(ms).toFixed(2)} ms` : '';
  if (state === 'pass' && ms != null) row.querySelector('.bar i').style.transform = `scaleX(${Math.max(.05, ms / maxMs)})`;
  n.querySelector('.detail').innerHTML = detail(r);
  row.disabled = false;
  n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop');
  const tag = {pass:'OK', fail:'FAIL', warn:'WARN', skip:'SKIP'}[state];
  log(tag, state === 'pass' ? `${r.reason}${ms != null ? `, ${ms} ms` : ''}` : r.reason, {pass:'ok', fail:'bad', warn:'warn', skip:''}[state]);
}

function showError(message, unreachable) {
  active = null;
  packet.classList.remove('on');
  document.body.classList.remove('running');
  nodes.forEach((n, i) => { n.dataset.state = 'idle'; n.querySelector('.sub').textContent = STEPS[i].idle; n.querySelector('.ms').textContent = ''; });
  $('#log').hidden = true;
  $('#go').disabled = false;
  $('#go').textContent = 'Run check';
  setChip('error', unreachable ? 'Server offline' : 'Check failed');
  decode($('#headline'), unreachable ? 'Server not reachable' : 'Check could not run');
  $('#lede').innerHTML = `<p>${esc(message)}</p>` +
    (unreachable ? '<p><button class="link" id="sample" type="button">Show sample results</button></p>' : '');
}

async function run(sample) {
  if (running) return;
  running = true;
  const domain = ($('#domain').value.trim().toLowerCase()) || 'google.com';
  runT = performance.now();
  setRunning(sample ? SAMPLE.domain : domain);

  const req = (sample ? sleep(500).then(() => ({data: SAMPLE})) :
    fetch('/api/run?domain=' + encodeURIComponent(domain)).then(async r => {
      const b = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(b.error || `The server returned ${r.status}.`);
      return {data: b};
    }).catch(err => ({err, unreachable: err instanceof TypeError}))
  );

  for (let i = 0; i < STEPS.length; i++) {
    activate(i, sample ? SAMPLE.domain : domain);
    const res = await req;
    if (res.err) {
      showError(res.unreachable
        ? 'Start the server with python server.py from an admin terminal, then open http://127.0.0.1:8000.'
        : res.err.message, res.unreachable);
      running = false;
      return;
    }
    const all = res.data.results;
    if (i === 0) maxMs = Math.max(1, ...STEPS.map(s => msOf(all[s.key]) || 0));
    const r = all[STEPS[i].key];
    const skipped = /^Skipped/.test(r.reason);
    target = skipped ? null : (msOf(r) ?? null);
    t0 = performance.now();
    dur = STEP_MS[i] * .92;
    await sleep(skipped ? 600 : STEP_MS[i]);
    settle(i, all);
    if (i === STEPS.length - 1) await finish(res.data);
  }
  running = false;
}

async function finish(data) {
  const all = data.results;
  lastReport = data;
  await sleep(reduce ? 0 : 500);
  packet.classList.remove('on');
  document.body.classList.remove('running');
  const healthy = !!(all.tls && all.tls.success);
  setChip(healthy ? 'pass' : 'fail', healthy ? 'Healthy' : 'Issue found');
  decode($('#headline'), verdict(all), 800);
  const lede = $('#lede');
  lede.innerHTML = (all.diagnosis || []).map(d => `<p>${esc(d)}</p>`).join('');
  lede.classList.remove('fade'); void lede.offsetWidth; lede.classList.add('fade');
  const time = new Date(data.ran_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const meta = $('#meta');
  meta.innerHTML = `Checked ${esc(data.domain)} at ${time}. <button class="link" id="dl" type="button">Download report</button>`;
  meta.hidden = false;
  $('#go').disabled = false;
  $('#go').textContent = 'Run again';
}

$('#form').addEventListener('submit', e => { e.preventDefault(); run(false); });
document.addEventListener('click', e => {
  if (e.target.id === 'sample') run(true);
  if (e.target.id === 'dl' && lastReport) {
    const url = URL.createObjectURL(new Blob([JSON.stringify(lastReport, null, 2)], {type:'application/json'}));
    const a = Object.assign(document.createElement('a'), {href:url, download:`network-doctor-${lastReport.domain}.json`});
    a.click();
    URL.revokeObjectURL(url);
  }
});

/* ---------- page load, spotlight, cursor, magnetic button ---------- */
decode($('#headline'), 'Check your connection', 900);

addEventListener('pointermove', e => {
  const s = document.documentElement.style;
  s.setProperty('--mx', e.clientX + 'px');
  s.setProperty('--my', e.clientY + 'px');
});

if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
  document.documentElement.classList.add('has-cursor');
  const cd = $('#cd'), cr = $('#cr');
  let x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y;
  addEventListener('pointermove', e => {
    x = e.clientX; y = e.clientY;
    document.body.classList.add('cur-on');
    const t = e.target.closest && e.target.closest('input, button:not(:disabled), a');
    document.body.dataset.cur = !t ? '' : t.tagName === 'INPUT' ? 'text' : 'link';
  });
  document.documentElement.addEventListener('mouseleave', () => document.body.classList.remove('cur-on'));
  addEventListener('pointerdown', () => document.body.classList.add('down'));
  addEventListener('pointerup', () => document.body.classList.remove('down'));
  (function follow() {
    rx += (x - rx) * (reduce ? 1 : .16);
    ry += (y - ry) * (reduce ? 1 : .16);
    cd.style.transform = `translate(${x}px,${y}px)`;
    cr.style.transform = `translate(${rx}px,${ry}px)`;
    requestAnimationFrame(follow);
  })();

  const go = $('#go');
  go.addEventListener('pointermove', e => {
    if (go.disabled) return;
    const b = go.getBoundingClientRect();
    go.style.transform = `translate(${(e.clientX - b.left - b.width / 2) * .18}px,${(e.clientY - b.top - b.height / 2) * .28}px)`;
  });
  go.addEventListener('pointerleave', () => { go.style.transform = ''; });
}
</script>
