<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network Doctor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7F7;--ink:#16212B;--mute:#6B7885;--line:#D5DDE1;--pass:#2B8A78;--fail:#C4492F;--warn:#B07A1C;--idle:#C3CCD2;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0F1519;--ink:#E7EDF0;--mute:#8A97A2;--line:#25313A;--pass:#4DBBA5;--fail:#E27A62;--warn:#D9A441;--idle:#37444D}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;font:400 16px/1.55 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
main{max-width:640px;margin:0 auto;padding:clamp(28px,6vw,56px) 24px 72px}
.mark{font-weight:500;font-size:15px}
h1{font:400 clamp(40px,9vw,64px)/1.04 'Instrument Serif',Georgia,serif;letter-spacing:-.015em;margin:72px 0 16px;text-wrap:balance}
#lede p{margin:0 0 10px;max-width:50ch;color:var(--mute)}
form{display:flex;gap:10px;margin-top:28px}
input{flex:1;min-width:0;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
button{font:inherit;cursor:pointer}
.go{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 22px;font-weight:500}
.go:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--pass);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;font-size:inherit}

.path{list-style:none;margin:56px 0 0;padding:0}
.node{position:relative;padding-left:36px}
.node:not(:last-child)::after{content:"";position:absolute;left:5px;top:33px;bottom:-22px;width:1px;background:var(--line);transition:background .5s}
.node[data-state=pass]:not(:last-child)::after,.node[data-state=warn]:not(:last-child)::after{background:var(--pass)}
.dot{position:absolute;left:0;top:22px;width:11px;height:11px;border-radius:50%;background:var(--idle);z-index:1;transition:background .4s,box-shadow .4s}
.node[data-state=pass] .dot{background:var(--pass)}
.node[data-state=fail] .dot{background:var(--fail);box-shadow:0 0 0 4px color-mix(in srgb,var(--fail) 18%,transparent)}
.node[data-state=warn] .dot{background:var(--warn)}
.node[data-state=skip] .dot{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--idle)}
.node[data-state=running] .dot{background:var(--mute);animation:pulse 1.2s ease-in-out infinite;animation-delay:calc(var(--i)*.18s)}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

.row{display:grid;grid-template-columns:1fr auto 12px;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;padding:14px 0;opacity:.55;transition:opacity .4s}
.node:not([data-state=idle]):not([data-state=running]) .row{opacity:1}
.row:disabled{cursor:default}
.name{display:block;font-weight:500}
.sub{display:block;font-size:14px;color:var(--mute)}
.ms{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.chev{color:var(--mute);transition:transform .2s;visibility:hidden}
.node:not([data-state=idle]):not([data-state=running]) .chev{visibility:visible}
.row[aria-expanded=true] .chev{transform:rotate(180deg)}
.detail{padding:0 0 18px;font-size:14px}
.detail[hidden]{display:none}
.why{margin:0 0 12px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 20px;margin:0}
dt{color:var(--mute)}
dd{margin:0;word-break:break-word;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 16px 6px 0;white-space:nowrap}
th{font-weight:400;color:var(--mute)}
.checks{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:4px}
.checks li{display:flex;gap:8px;align-items:center}
.checks i{width:7px;height:7px;border-radius:50%;background:var(--pass);flex:none}
.checks .bad i{background:var(--fail)}

.meta{margin:28px 0 0;font-size:14px;color:var(--mute)}
.foot{margin:56px 0 0;font-size:13px;color:var(--mute)}
.fade{animation:fade .6s ease both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(max-width:480px){form{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <span class="mark">Network Doctor</span>

  <h1 id="headline">Check your connection</h1>
  <div id="lede"><p>Tests your router, the internet, DNS and a secure connection in order, then explains what it found.</p></div>

  <form id="form">
    <input id="domain" value="google.com" aria-label="Website to test" spellcheck="false" autocomplete="off" maxlength="253">
    <button class="go" id="go" type="submit">Run check</button>
  </form>

  <ol class="path" id="path"></ol>
  <p class="meta" id="meta" hidden></p>
  <p class="foot">Runs on this computer. Every result comes straight from network-doctor.py.</p>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const STEPS = [
  {key:'gateway',  name:'Your router',      idle:'Default gateway',  sub:r => r.destination ? `Gateway ${r.destination}` : 'Default gateway'},
  {key:'internet', name:'The internet',     idle:'Ping 1.1.1.1',     sub:r => `Ping ${r.destination || '1.1.1.1'}`},
  {key:'dns',      name:'Name lookup',      idle:'DNS',              sub:r => r.domain ? `${r.domain} via ${r.server}` : 'DNS'},
  {key:'tcp',      name:'Connection',       idle:'Port 443',         sub:r => r.server ? `${r.server}, port ${r.port}` : 'Port 443'},
  {key:'tls',      name:'Secure handshake', idle:'Certificate check',sub:r => r.tls_version ? `${r.tls_version}, certificate verified` : 'Certificate check'}
];
const LABELS = {tls_version:'TLS version', rcode_name:'Response code', record_type:'Record type', certificate_verified:'Certificate verified'};
const HIDE = new Set(['success','reason','latency_ms','connection_plus_tls_ms','checks','answers','response_valid','rcode']);

const SAMPLE = {domain:'google.com', ran_at:new Date().toISOString(), duration_s:2.4, results:{
  gateway:{success:true,reason:'Ping reply validated',destination:'192.168.1.1',latency_ms:3.1,checks:{ip_addresses:true,echo_reply_type:true,icmp_code:true,identifier:true,sequence:true}},
  internet:{success:true,reason:'Ping reply validated',destination:'1.1.1.1',latency_ms:24.8,checks:{ip_addresses:true,echo_reply_type:true,icmp_code:true,identifier:true,sequence:true}},
  dns:{success:true,reason:'DNS resolution successful',response_valid:true,server:'8.8.8.8',domain:'google.com',record_type:'A',rcode:0,rcode_name:'NOERROR',latency_ms:31.4,checks:{source_ip:true,destination_ip:true,source_port:true,destination_port:true,is_response:true,transaction_id:true,opcode:true,question:true},answers:[{name:'google.com',type:'A',ttl:112,data:'142.250.185.78'}]},
  tcp:{success:true,reason:'TCP connection established',server:'142.250.185.78',port:443,latency_ms:29.7},
  tls:{success:true,reason:'TLS handshake successful; certificate verification passed',server:'142.250.185.78',domain:'google.com',tls_version:'TLSv1.3',cipher:'TLS_AES_256_GCM_SHA384',certificate_verified:true,connection_plus_tls_ms:88.2},
  diagnosis:['DNS, TCP, and TLS checks succeeded. The tested HTTPS connection path is working. This does not yet test an HTTP response.']
}};

const path = $('#path');
path.innerHTML = STEPS.map((s,i) => `
  <li class="node" data-state="idle" style="--i:${i}">
    <span class="dot"></span>
    <button class="row" type="button" aria-expanded="false" disabled>
      <span><span class="name">${s.name}</span><span class="sub">${s.idle}</span></span>
      <span class="ms"></span>
      <svg class="chev" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M3 4.5l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="detail" hidden></div>
  </li>`).join('');
const nodes = [...path.children];
let lastReport = null;

path.addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (!row || row.disabled) return;
  const open = row.getAttribute('aria-expanded') === 'true';
  row.setAttribute('aria-expanded', String(!open));
  row.nextElementSibling.hidden = open;
});

function stateOf(key, r, all) {
  if (!r) return 'idle';
  if (r.success) return 'pass';
  if (/^Skipped/.test(r.reason)) return 'skip';
  if ((key === 'gateway' || key === 'internet') && all.tls && all.tls.success) return 'warn';
  return 'fail';
}

function verdict(a) {
  if (a.tls && a.tls.success) return 'Your connection is healthy';
  if (!a.gateway.success && !a.internet.success && !a.dns.success) return 'You appear to be offline';
  if (!a.dns.success) return 'Names are not resolving';
  if (!a.tcp.success) return 'The server cannot be reached';
  return 'The secure handshake failed';
}

function detail(r) {
  let h = `<p class="why">${esc(r.reason)}</p><dl>`;
  for (const [k, v] of Object.entries(r)) {
    if (HIDE.has(k) || v == null) continue;
    const label = LABELS[k] || k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, ' ');
    h += `<dt>${esc(label)}</dt><dd>${esc(typeof v === 'boolean' ? (v ? 'Yes' : 'No') : v)}</dd>`;
  }
  h += '</dl>';
  if (r.answers && r.answers.length) {
    h += `<div class="scroll"><table><tr><th>Name</th><th>Type</th><th>TTL</th><th>Address</th></tr>` +
      r.answers.map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.type)}</td><td>${esc(a.ttl)}s</td><td>${esc(a.data)}</td></tr>`).join('') + `</table></div>`;
  }
  if (r.checks) {
    h += `<ul class="checks">` + Object.entries(r.checks).map(([k, ok]) =>
      `<li class="${ok ? '' : 'bad'}"><i></i>${esc(k.replace(/_/g, ' '))}: ${ok ? 'passed' : 'failed'}</li>`).join('') + `</ul>`;
  }
  return h;
}

function paint(i, all) {
  const step = STEPS[i], r = all[step.key], node = nodes[i], row = node.firstElementChild.nextElementSibling;
  const state = stateOf(step.key, r, all);
  const ms = r.latency_ms != null ? r.latency_ms : r.connection_plus_tls_ms;
  node.dataset.state = state;
  row.querySelector('.sub').textContent = state === 'pass' ? step.sub(r) :
    (state === 'warn' ? 'No reply, but later checks passed. Ping may be blocked.' : r.reason);
  row.querySelector('.ms').textContent = ms != null ? `${ms} ms` : '';
  node.querySelector('.detail').innerHTML = detail(r);
  row.disabled = false;
}

function setRunning() {
  nodes.forEach((n, i) => {
    n.dataset.state = 'running';
    const row = n.querySelector('.row');
    row.disabled = true;
    row.setAttribute('aria-expanded', 'false');
    row.querySelector('.sub').textContent = STEPS[i].idle;
    row.querySelector('.ms').textContent = '';
    n.querySelector('.detail').hidden = true;
  });
  $('#headline').textContent = 'Checking…';
  $('#lede').innerHTML = '<p>This takes a few seconds.</p>';
  $('#meta').hidden = true;
  $('#go').disabled = true;
  $('#go').textContent = 'Running…';
}

function reset() {
  nodes.forEach((n, i) => {
    n.dataset.state = 'idle';
    n.querySelector('.row').disabled = true;
    n.querySelector('.sub').textContent = STEPS[i].idle;
  });
  $('#go').disabled = false;
  $('#go').textContent = 'Run check';
}

async function show(data) {
  const all = data.results;
  lastReport = data;
  for (let i = 0; i < STEPS.length; i++) {
    if (!reduce) await sleep(170);
    paint(i, all);
  }
  const h = $('#headline');
  h.textContent = verdict(all);
  $('#lede').innerHTML = (all.diagnosis || []).map(d => `<p>${esc(d)}</p>`).join('');
  [h, $('#lede')].forEach(el => { el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); });

  const time = new Date(data.ran_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  const meta = $('#meta');
  meta.innerHTML = `Checked ${esc(data.domain)} at ${time}, took ${esc(data.duration_s)} s. <button class="link" id="dl" type="button">Download report</button>`;
  meta.hidden = false;
  $('#go').disabled = false;
  $('#go').textContent = 'Run again';
}

function showError(message, unreachable) {
  reset();
  $('#headline').textContent = unreachable ? 'Server not reachable' : 'Check could not run';
  $('#lede').innerHTML = `<p>${esc(message)}</p>` +
    (unreachable ? '<p><button class="link" id="sample" type="button">Show sample results</button></p>' : '');
}

async function run() {
  setRunning();
  try {
    const res = await fetch('/api/run?domain=' + encodeURIComponent($('#domain').value.trim()));
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || `The server returned ${res.status}.`);
    await show(body);
  } catch (err) {
    const unreachable = err instanceof TypeError;
    showError(unreachable
      ? 'Start the server with python server.py from an admin terminal, then open http://127.0.0.1:8000.'
      : err.message, unreachable);
  }
}

$('#form').addEventListener('submit', e => { e.preventDefault(); run(); });

document.addEventListener('click', e => {
  if (e.target.id === 'sample') { setRunning(); show(SAMPLE); }
  if (e.target.id === 'dl' && lastReport) {
    const url = URL.createObjectURL(new Blob([JSON.stringify(lastReport, null, 2)], {type:'application/json'}));
    const a = Object.assign(document.createElement('a'), {href:url, download:`network-doctor-${lastReport.domain}.json`});
    a.click();
    URL.revokeObjectURL(url);
  }
});
</script>
</body>
</html>
